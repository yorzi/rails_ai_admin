name: Rails main
# The suite against Rails main, so upstream changes show up before a Rails
# release reaches hosts. A failure here is an early warning, not a release
# blocker: releases are tested against Gemfile.lock in CI.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    env:
      BUNDLE_GEMFILE: gemfiles/rails_main.gemfile
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: raa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Rails version under test
        run: bundle exec ruby -e 'require "rails"; puts Rails.version' && bundle exec ruby -e 'puts Bundler.load.specs.find { |spec| spec.name == "railties" }.source.revision'
      - name: SQLite contracts and requests
        if: matrix.database == 'sqlite'
        run: bundle exec rake test
      - name: PostgreSQL contracts and requests
        if: matrix.database == 'postgres'
        env:
          RAA_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/raa_test
        run: bundle exec rake test
