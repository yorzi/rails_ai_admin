name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: raa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rubocop --cache false
      - name: SQLite contracts and requests
        if: matrix.database == 'sqlite'
        run: bundle exec rake test
      - name: PostgreSQL contracts and requests
        if: matrix.database == 'postgres'
        env:
          RAA_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/raa_test
        run: bundle exec rake test
      - run: bundle exec rake build
      - run: bundle exec rake release:check_candidate
      - name: Packaged Rails authentication quickstart
        if: matrix.database == 'sqlite'
        run: bundle exec ruby script/packaged_quickstart_smoke.rb
      - name: Packaged session / SQLite consumer
        run: bundle exec ruby script/packaged_smoke.rb
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.database == 'postgres'
        with:
          node-version: "26"
      - name: Create disposable support host database
        if: matrix.database == 'postgres'
        env:
          PGPASSWORD: synthetic-ci-only
        run: createdb -h 127.0.0.1 -U postgres raa_host_b_test
      - name: Packaged Devise / Pundit / PostgreSQL host and crash recovery
        if: matrix.database == 'postgres'
        env:
          RAA_HOST_B_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/raa_host_b_test
        run: |
          bundle exec ruby script/packaged_support_smoke.rb
          bundle exec ruby script/packaged_recovery_smoke.rb
          bundle exec ruby script/packaged_collection_recovery_smoke.rb
      - name: Sprockets plus jsbundling consumer
        if: matrix.database == 'postgres'
        env:
          RAA_HOST_B_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/raa_host_b_test
          RAA_ASSET_PIPELINE: sprockets
        run: bundle exec ruby script/packaged_support_smoke.rb

  # The engine suite on the oldest supported Ruby. gemspec bounds (Ruby >= 3.3,
  # Rails >= 8.1.4.1 and < 8.2) come from what passes here and in the test job,
  # which runs Ruby 4.0.9.
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3"]
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: raa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: SQLite contracts and requests
        if: matrix.database == 'sqlite'
        run: bundle exec rake test
      - name: PostgreSQL contracts and requests
        if: matrix.database == 'postgres'
        env:
          RAA_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/raa_test
        run: bundle exec rake test

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - run: npm audit --prefix frontend --audit-level=high

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version
      - name: Install documentation dependencies
        working-directory: docs/site
        run: |
          bundle config set --local path ../../vendor/docs-bundle
          bundle install
      - run: docs/site/bin/build.sh
