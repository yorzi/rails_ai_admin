name: Publish gem

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the verified gem to RubyGems
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rubygems-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v0.1.0
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Verify the tested release and build its gem
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 8ef37f24fa76e49bbe90cfcf1e18ded65c6685d1
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bundle exec rake build release:check
          printf '%s  %s\n' 04aaa7b9270b9ef6ddce5141356c026f457459afdb85447fc4dfa7da1e443c53 pkg/rails_ai_admin-0.1.0.gem | sha256sum --check
      - name: Push 0.1.0 to RubyGems
        if: inputs.publish
        # The first push requires an explicit RubyGems owner. The official
        # credentials action does not yet pass this input to the exchange API.
        run: |
          ruby <<'RUBY'
          require "json"
          require "net/http"
          require "rubygems/gem_runner"
          require "uri"

          request_url = URI(ENV.fetch("ACTIONS_ID_TOKEN_REQUEST_URL"))
          request_url.query = URI.encode_www_form(URI.decode_www_form(request_url.query.to_s) + [["audience", "rubygems.org"]])
          request = Net::HTTP::Get.new(request_url)
          request["Authorization"] = "Bearer #{ENV.fetch("ACTIONS_ID_TOKEN_REQUEST_TOKEN")}"
          response = Net::HTTP.start(request_url.host, request_url.port, use_ssl: true, open_timeout: 10, read_timeout: 20) { |http| http.request(request) }
          abort "GitHub OIDC request failed: HTTP #{response.code}" unless response.is_a?(Net::HTTPSuccess)
          jwt = JSON.parse(response.body).fetch("value")

          exchange_url = URI("https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token")
          headers = { "Content-Type" => "application/json", "Accept" => "application/json" }
          body = JSON.generate(jwt: jwt, owner: "42846")
          response = Net::HTTP.start(exchange_url.host, exchange_url.port, use_ssl: true, open_timeout: 10, read_timeout: 20) { |http| http.post(exchange_url.request_uri, body, headers) }
          abort "RubyGems token exchange failed: HTTP #{response.code}" unless response.is_a?(Net::HTTPSuccess)
          key = JSON.parse(response.body).fetch("rubygems_api_key")
          abort "Invalid RubyGems key response" unless key.is_a?(String) && key.match?(/\A[a-zA-Z0-9_]+\z/)
          puts "::add-mask::#{key}"
          ENV["GEM_HOST_API_KEY"] = key
          Gem::GemRunner.new.run(["push", "pkg/rails_ai_admin-0.1.0.gem"])
          RUBY
