name: Dependency security
on:
  pull_request:
  push:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: .ruby-version
      - run: gem install bundler-audit --version 0.9.3 --no-document
      - run: bundle-audit check --update --database tmp/ruby-advisory-db
      - name: Audit documentation bundle
        run: bundle-audit check --database tmp/ruby-advisory-db --gemfile-lock docs/site/Gemfile.lock
      - name: Audit the Rails 8.0 compatibility bundle
        run: bundle-audit check --database tmp/ruby-advisory-db --gemfile-lock gemfiles/rails_8_0.gemfile.lock
